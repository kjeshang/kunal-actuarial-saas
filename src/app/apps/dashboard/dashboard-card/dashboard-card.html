<mat-card class="h-full shadow-xl cursor-pointer hover:scale-115 transition duration-200" [routerLink]="app.route">
    <mat-card-header class="flex items-center justify-center">
        <div class="flex items-center justify-around space-x-2">
            <mat-icon>{{ app.icon }}</mat-icon>
            <mat-card-title class="text-2xl! font-semibold!">{{ app.title }}</mat-card-title>
        </div>
    </mat-card-header>
    <mat-card-content class="p-2 m-2 flex items-center justify-center">
        <mat-divider />
        <p class="pt-2 pb-4">{{ app.description }}</p>
    </mat-card-content>
    <mat-card-footer class="p-2 m-2 bg-gray-300 rounded-md flex items-center justify-center">
        <p class="font-thin capitalize">{{ app.category }}</p>
    </mat-card-footer>
</mat-card>
