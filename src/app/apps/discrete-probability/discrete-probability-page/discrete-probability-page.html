<app-feature-container>
    <div class="p-2 m-2 flex flex-col space-y-4">
        <section>
            <app-discrete-probability-parameters />
        </section>
        <section class="grid grid-cols-2 sm:grid-cols-4 gap-4">
            <app-discrete-probability-summary-card
                [metric]="discreteProbabilityStore.discreteProbabilityExpectedValue()" />
            <app-discrete-probability-summary-card
                [metric]="discreteProbabilityStore.discreteProbabilitySecondMoment()" />
            <app-discrete-probability-summary-card [metric]="discreteProbabilityStore.discreteProbabilityVariance()" />
            <app-discrete-probability-summary-card
                [metric]="discreteProbabilityStore.discreteProbabilityStandardDeviation()" />
        </section>
        <section>
            <mat-tab-group>
                <mat-tab label="Visualizations">
                    <ng-template matTabContent>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <app-line-chart class="mt-2" [chartData]="discreteProbabilityStore.pmfChart()!" />
                            <app-multi-line-chart class="mt-2" [chartData]="discreteProbabilityStore.cdfVsSfChart()!" />
                        </div>
                    </ng-template>
                </mat-tab>
                <mat-tab label="Table">
                    <ng-template matTabContent>
                        <app-discrete-probability-table
                            [discreteProbabilityConfiguration]="discreteProbabilityConfiguration"
                            [discreteProbabilityDistributionParameters]="discreteProbabilityStore.discreteProbabilityDistributionParameters()!"
                            [discreteProbabilityDistributionMetrics]="[
                                discreteProbabilityStore.discreteProbabilityExpectedValue()!,
                                discreteProbabilityStore.discreteProbabilitySecondMoment()!,
                                discreteProbabilityStore.discreteProbabilityVariance()!,
                                discreteProbabilityStore.discreteProbabilityStandardDeviation()!
                            ]"
                            [discreteProbabilityDistributionTable]="discreteProbabilityStore.discreteProbabilityDistributionTable()" />
                    </ng-template>
                </mat-tab>
            </mat-tab-group>
        </section>
    </div>
</app-feature-container>
