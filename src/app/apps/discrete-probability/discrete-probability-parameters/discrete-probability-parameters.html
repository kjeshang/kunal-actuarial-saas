<form [formGroup]="probabilityParametersForm">
    <mat-accordion>
        <mat-expansion-panel [expanded]="true">
            <mat-expansion-panel-header>
                <mat-panel-title>Probability Distribution Parameters</mat-panel-title>
            </mat-expansion-panel-header>
            <div class="pb-1 grid grid-cols-1 sm:grid-cols-5 gap-4">
                <div>
                    <mat-form-field class="w-full">
                        <mat-label>Probability Distribution</mat-label>
                        <mat-select formControlName="probabilityDistribution" (selectionChange)="onSelectProbabilityDistribution()">
                            <mat-option value="binomial">Binomial</mat-option>
                            <!-- <mat-option value="uniform">Discrete Uniform</mat-option> -->
                            <mat-option value="geometric">Geometric</mat-option>
                            <mat-option value="poisson">Poisson</mat-option>
                            <!-- <mat-option value="negative-binomial">Negative Binomial</mat-option> -->
                        </mat-select>
                        <mat-error>Please select a probability distribution</mat-error>
                    </mat-form-field>
                </div>
                <ng-container formGroupName="params">
                    {{ paramsFormGroup.value | json }}
                </ng-container>
            </div>
        </mat-expansion-panel>
    </mat-accordion>
</form>
