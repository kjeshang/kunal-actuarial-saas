<mat-card class="h-full" appearance="outlined">
    <mat-card-header class="flex items-center justify-center">
        <p class="font-thin text-center tracking-wider" [innerHTML]="label">
    </mat-card-header>
    <mat-card-content class="flex items-center justify-center">
        <p class="text-2xl text-center pt-2">
            {{ displayValue }}
        </p>
    </mat-card-content>
</mat-card>
